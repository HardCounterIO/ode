title: Detection Health & Lifecycle
slug: detection-health-and-lifecycle
status: draft  # draft | in-review | reviewed | stable | needs-update | deprecated
version: 0.1

summary: >
  Detection Health & Lifecycle teaches how to keep deployed detections working and relevant over time: who owns their health, the states they move through, monitoring the data they depend on and the detections themselves, continuous validation, troubleshooting silent failures, reviewing stale detections, and updating, parking, or retiring them.

learning_objectives:
  - Distinguish a quiet detection from a blind one, and a silent failure from a stale detection.
  - Justify a detection's lifecycle transitions, from first release to retirement, with health, validation, and review evidence.
  - Design source-level and field-level data health checks for a set of detections.
  - Evaluate the health of a single detection from its execution, output, and validation signals.
  - Diagnose why a detection has stopped alerting.
  - Evaluate whether a working detection has become stale, using a defined review cadence and review criteria.

prerequisites:
  - 01 Detection Engineering Foundations
  - 02 Telemetry & Data
  - 06 Testing & Validation

