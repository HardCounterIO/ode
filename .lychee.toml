# Link checker configuration (lychee).
# Templates contain placeholder links on purpose. Values are regular expressions.
exclude_path = ["(^|/)templates/"]

# Check #fragment anchors in local Markdown files.
include_fragments = "full"

# 429 means rate limited, not broken.
accept = ["200..=299", "429"]
max_retries = 3

exclude = [
  # Returns 404 to anonymous visitors; it only works when signed in.
  '^https://github\.com/ode-os/detection-engineering/security/advisories/new$',
  '^mailto:',
]
